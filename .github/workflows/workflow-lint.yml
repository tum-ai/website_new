name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: Audit workflows with zizmor
        # Workflows, actions and dependabot.yml, with the triage in
        # .github/zizmor.yml. The version is pinned so a new zizmor release
        # can't fail every workflow PR with new audits; bump it deliberately.
        run: pipx run zizmor==1.30.1 --no-progress --config .github/zizmor.yml .github
